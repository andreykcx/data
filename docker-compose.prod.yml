version: "3.9"

services:
  db:
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://frontend:8080,http://localhost:8080}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes: []

  frontend:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env.frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://api:8000}
    ports:
      - "8080:80"
    volumes: []
